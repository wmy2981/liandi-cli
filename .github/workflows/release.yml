name: Release

# Publishing is tag-driven: pushing vX.Y.Z to main publishes to npm.
# Manual runs publish too, but only from main; opt into a dry run explicitly.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify everything but skip npm publish (opt-in dry run)
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: verify release prerequisites
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          # GitHub may deliver the tag event before the branch update; retry briefly.
          for attempt in 1 2 3 4 5; do
            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "tag commit $GITHUB_SHA is on main"
              exit 0
            fi
            echo "attempt $attempt: commit not on origin/main yet, retrying"
            sleep 15
            git fetch --no-tags origin main
          done
          echo "::error::Tag commit is not on main. Merge to main before tagging."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check version and tag agree
        id: version
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          node scripts/check-version.mjs $TAG
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  verify:
    name: build and test
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/verify.mjs
      - run: node scripts/pack-check.mjs

  publish:
    name: publish to npm
    needs: [guard, verify]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1+; Node 24 ships npm 11.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # prepack/prepublishOnly run the build, so dev dependencies are required.
      - run: npm ci

      - name: Decide whether to publish
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            echo "mode=dry-run" >> "$GITHUB_OUTPUT"
          elif [ "$REF_TYPE" = "tag" ] || [ "$REF" = "refs/heads/main" ]; then
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Publishing is only allowed from main or from a release tag."
            exit 1
          fi
          echo "version=${{ needs.guard.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing version
        if: steps.gate.outputs.mode == 'publish'
        run: |
          if npm view "$(node -p "require('./package.json').name")@${{ steps.gate.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::Version ${{ steps.gate.outputs.version }} is already published. Bump the version first."
            exit 1
          fi

      # No token: the registry accepts this workflow through the trusted publisher
      # configured for the package on npmjs.com, authenticated with the OIDC token
      # requested by the `id-token: write` permission above.
      - name: Publish
        if: steps.gate.outputs.mode == 'publish'
        run: npm publish --access public --provenance

      - name: Dry run
        if: steps.gate.outputs.mode == 'dry-run'
        run: |
          echo "dry run: everything verified, skipping npm publish"
          npm pack --dry-run

      - name: Create GitHub release
        if: steps.gate.outputs.mode == 'publish' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
